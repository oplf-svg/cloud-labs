name: sign-in

# Signs in to each cloud as the identity that can only look, and checks where its rights end. The environment allows main
# only, so nothing runs here before a person has approved it. What it does stands in check_sign_in.py and not here, because
# agents may not change a workflow file.
on:
  push:
    branches: [main]
    paths:
      - bootstrap/**
      - .github/workflows/sign-in.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: sign-in

# Each job names its own cloud's secrets and no others. GitHub hides a value only in jobs that use it.
jobs:
  aws:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: plan
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_STATE_BUCKET: ${{ secrets.AWS_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 bootstrap/scripts/check_sign_in.py aws

  azure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: plan
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_STATE_ACCOUNT: ${{ secrets.AZURE_STATE_ACCOUNT }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 bootstrap/scripts/check_sign_in.py azure

  gcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: plan
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
      GCP_STATE_BUCKET: ${{ secrets.GCP_STATE_BUCKET }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 bootstrap/scripts/check_sign_in.py gcp
